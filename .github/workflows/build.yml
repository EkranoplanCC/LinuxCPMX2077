name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish this build as a release tagged v<app version>
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  appimage:
    needs: test
    # Build on the oldest supported Ubuntu so the AppImage runs on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build --bundles appimage
        working-directory: src-tauri
      - name: Name the AppImage
        working-directory: target/release/bundle/appimage
        run: for f in *.AppImage; do [ "$f" = "${f// /-}" ] || mv "$f" "${f// /-}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: target/release/bundle/appimage/*.AppImage

  # The Windows installer (NSIS). Windows-only code is linted here; the unit
  # tests run on Linux only for now.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build --bundles nsis
        working-directory: src-tauri
      - name: Name the installer
        shell: bash
        working-directory: target/release/bundle/nsis
        run: for f in *.exe; do [ "$f" = "${f// /-}" ] || mv "$f" "${f// /-}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/bundle/nsis/*-setup.exe

  # Pushing a tag like v0.2.0, or running the workflow by hand with "release"
  # ticked, publishes the AppImage and the Windows installer as a GitHub
  # release (versions below 1.0 as pre-releases).
  release:
    needs: [appimage, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.AppImage *.exe > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the app version ($tag)" >&2
            exit 1
          fi
          pre=""
          case "$tag" in v0.*) pre="--prerelease" ;; esac
          gh release create "$tag" $pre --target "$GITHUB_SHA" --title "$tag" --generate-notes \
            --notes "Linux: download the AppImage, make it executable (\`chmod +x\`) and run it. Windows (early preview): run the -setup.exe installer; it isn't code-signed yet, so SmartScreen asks once (More info, Run anyway). SHA256SUMS lists every file's checksum." \
            dist/*.AppImage dist/*.exe dist/SHA256SUMS
