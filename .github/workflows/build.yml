name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  appimage:
    needs: test
    # Build on the oldest supported Ubuntu so the AppImage runs on older glibc.
    runs-on: ubuntu-22.04
    permissions:
      contents: write # publish the release on version tags
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build --bundles appimage
        working-directory: src-tauri
      - name: Name the AppImage and checksum it
        working-directory: target/release/bundle/appimage
        run: |
          for f in *.AppImage; do mv "$f" "${f// /-}"; done
          sha256sum *.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/SHA256SUMS
      # Pushing a tag like v0.2.0 publishes this build as a GitHub release
      # (versions below 1.0 as pre-releases).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match app version $version" >&2
            exit 1
          fi
          pre=""
          case "$GITHUB_REF_NAME" in v0.*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Download the AppImage, make it executable (\`chmod +x\`) and run it. SHA256SUMS lists its checksum." \
            target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/SHA256SUMS
