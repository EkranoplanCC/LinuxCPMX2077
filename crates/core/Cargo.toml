[package]
name = "cp2077mm-core"
version = "0.4.1"
edition = "2024"

[dependencies]
dirs = "7.0.0"
hex = "0.4.3"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
log = "0.4.34"
md-5 = "0.11.0"
pelite = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust2 = "0.23.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "lzma", "time"] }
